[workspace]
members = [
    "cli",
    "core/consensus",
    "core/sequencer",
    "core/execution",
    "core/storage",
    "core/primitives",
    "core/api",
    "core/network",
    "core/mcp",
    "core/economics",
    "core/marketplace",
    "core/learning",
    "core/bridge",
    "node",
    "node-app",
    "wallet",
    "wallet-core",
    "wallet-sdk",
    "faucet",
    "gui/citrate_desktop_app",
    "gui/citrate_gui_native",
    "agent-core",
    "agent-chain",
    "agent-cron",
    "agent-code",
    "gui/citrate_edu_app",
    "gui/citrate_learning_center",
    "crates/x402-axum",
    "gateway",
]
# Default build targets: unified node binary (includes wallet + CLI).
# Standalone wallet/cli/faucet can still be built with `cargo build -p citrate-wallet` etc.
default-members = [
    "core/consensus",
    "core/sequencer",
    "core/execution",
    "core/storage",
    "core/primitives",
    "core/api",
    "core/network",
    "core/mcp",
    "core/economics",
    "core/marketplace",
    "node",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Citrate Network"]
license = "MIT"
repository = "https://github.com/citrate-network/citrate"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography
sha3 = "0.10"
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["serde"] }
x25519-dalek = "2.0"
# Workspace pin: "0.8" (range, not an exact =). rand 0.9 is a
# breaking API migration (thread_rng→rng, gen→random, OsRng becomes
# TryCryptoRng). Our direct-use crates (consensus, execution, wallet,
# network, cli, etc.) still use the 0.8 API. Migration tracked in
# BACKLOG #124.
#
# We intentionally allow transitive consumers (e.g. rfd → ashpd →
# rand 0.9) to pull their own 0.9 copy. Cargo de-duplicates major-
# version trees, so direct consumers stay on 0.8 and the two versions
# coexist until the migration closes #124. Do NOT change this to an
# exact "=0.8.6" — that forces a resolution error on any crate that
# requires 0.9.
#
# Dependabot history: PRs #62, #83 (2026-04-22) both tried to bump
# this to 0.9.x. The `ignore` rule in dependabot.yml blocks
# semver-major/minor; the "security group" override bypassed it
# once. Keep this pin and close future Dependabot rand PRs with a
# pointer to BACKLOG #124 until the migration ships.
rand = "0.8"

# Networking
libp2p = "0.54"
quinn = "0.11"

# Storage
rocksdb = "0.22"
sled = "0.34"

# Time
chrono = "0.4"

# Concurrency
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Testing
# Pinned to 1.5.0 — proptest 1.11+ requires rand 0.9 which we haven't
# migrated to yet (BACKLOG #124). Workspace-wide pin here so every
# consumer stays on a version compatible with rand 0.8.6.
proptest = "=1.5.0"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
