# cargo-packager configuration for Citrate Inference Gateway.
#
# Generated by branding/templates/apply-tier2.sh from
# citrate-labs/branding/templates/packager.toml.template — edits made
# here in the consumer repo will be overwritten on the next sync.
# Adjust template variables in apply-tier2.sh or the per-repo manifest
# (branding/templates/repos.toml) instead.
#
# Build with:
#   cargo install --locked cargo-packager
#   cargo packager --release --config packager.toml
#
# Output goes to ./target/release/* unless `out-dir` is overridden by
# the workflow.

# cargo-packager treats `enabled = false` as the default — without this
# line the config is silently dropped with "Couldn't detect a valid
# configuration file or all configurations are disabled!".
enabled      = true
product-name = "Citrate Inference Gateway"
identifier   = "ai.citrate.gateway"
version      = "0.4.0"
description  = "Citrate inference gateway — x402-settled OpenAI-compatible proxy"
long-description = """
Operator daemon that fronts a fleet of inference workers behind an OpenAI-compatible HTTPS API with x402 settlement on the Citrate chain. Intended for operators running model-serving infrastructure who want on-chain settlement and rate-limiting without rolling their own.
"""
authors  = ["Citrate Labs <support@citrate.ai>"]
homepage = "https://citrate.ai"
category = "Network"
copyright = "© 2026 Citrate Labs. BUSL-1.1."
# Output formats. cargo-packager skips formats whose toolchain isn't
# present on the build host: Linux runners produce deb + appimage,
# macOS produces app + dmg, Windows produces msi + nsis. (rpm landed
# in cargo-packager main but isn't in 0.11.x; revisit when we upgrade.)
formats = ["app", "dmg", "wix", "nsis", "deb", "appimage"]

# Pre-built platform icons + a PNG fallback ladder. cargo-packager picks
# per target: .icns for macOS (used directly — avoids the lossy PNG→icns
# generation that aborts with "No matching IconType" on non-icns sizes
# like 48/64), .ico for Windows, and the PNGs for Linux .desktop hicolor.
icons = [
  "../branding/icons/citrate.icns",
  "../branding/icons/citrate.ico",
  "../branding/icons/icon-512.png",
  "../branding/icons/icon-256.png",
  "../branding/icons/icon-128.png",
]

# Files to bundle alongside the binary inside the app/installer.
# Keep this minimal — large bundled assets break differential updates.
resources = [

]

# Explicit binary inventory. `main = true` marks the entrypoint for
# launcher menus (Start Menu group, Dock icon, .desktop Exec=).
[[binaries]]
path = "citrate-gateway"
main = true

# ─────────────────────────── macOS ───────────────────────────
[macos]
# Codesign identity — the GitHub Actions workflow injects this from
# secrets.APPLE_SIGNING_IDENTITY at package time. When unset (local
# dev), packager emits an unsigned .app and Gatekeeper will warn
# the user the first time they run it.
signing-identity = ""
minimum-system-version = "11.0"
# entitlements file gates JIT, audio, camera, etc.; the default
# entitlements at branding/templates/entitlements.plist enables
# hardened-runtime (required for notarisation) and allows the
# unsigned-executable-memory cap that bindgen-using crates trip on
# without it.
entitlements = "../branding/templates/entitlements.plist"
# info-plist-path overrides cargo-packager's auto-generated Info.plist
# when we need to bake in NSCameraUsageDescription, deep-link
# protocols, etc. None required at v0.5.0-beta2.
# info-plist-path = "../branding/templates/Info.plist"

[dmg]
# Layout for the drag-to-Applications DMG.
window-size = { width = 660, height = 400 }
app-position    = { x = 180, y = 170 }
application-folder-position = { x = 480, y = 170 }
# background = "../branding/dmg-background.png"   # TODO design pass

# ─────────────────────────── Windows ───────────────────────────
[windows]
digest-algorithm = "sha256"
# certificate-thumbprint = ""    # injected from secrets at sign time
timestamp-url = "http://timestamp.digicert.com"
tsp = true
allow-downgrades = false

[wix]
# WiX produces .msi. Use NSIS instead for .exe installer with custom
# wizard; we ship both so partners can pick. cargo-packager derives
# the MSI upgrade-code automatically from the bundle identifier
# (UUIDv5 in the OID namespace) — re-runs are stable as long as
# the identifier doesn't change.
languages = ["en-US"]
fips-compliant = false

[nsis]
# NSIS .exe installer — friendlier for non-technical Windows users.
installer-mode = "currentUser"   # "perMachine" requires admin elevation
languages = ["English"]

# ─────────────────────────── Linux (.deb) ───────────────────────────
[deb]
priority = "optional"
section = "net"
# Runtime deps. Vendored OpenSSL means no libssl3. libc6 is implicit.
depends = []
# desktop-template = "../branding/templates/desktop-template.desktop"
# Files to copy to absolute paths on install.
# files = { "../branding/icons/icon-256.png" = "/usr/share/icons/hicolor/256x256/apps/citrate-gateway.png" }

# ─────────────────────────── Linux (AppImage) ───────────────────────────
[appimage]
# Extra .so libs to bundle so the AppImage runs on minimal hosts.
libs = []
files = {}
