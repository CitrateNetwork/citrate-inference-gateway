[package]
name = "citrate-inference-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "OpenAI-compatible HTTP gateway over the Citrate compute marketplace. Translates /v1/chat/completions and /v1/batch into x402-gated InferenceRouter / ComputeMarketplace dispatches."

# See:
# - .agentile/sprints/active/SPRINT_CM_03_BATCH_INFERENCE_GATEWAY.md
# - .agentile/formal/specs/compute/GatewayBatchLifecycle.tla — batch state machine
# - citrate_v0.01.1/specs/gherkin/gateway_inference.feature — behavior contract

# Dual lib + bin so integration tests can call into the router
# without spawning a separate process.

[lib]
name = "citrate_gateway"
path = "src/lib.rs"

[[bin]]
name = "citrate-inference-gateway"
path = "src/main.rs"

# ──────────────────────────────────────────────────────────────────────
# Native installer packaging (cargo-packager).
# Produces .deb + .AppImage on Linux, .dmg on macOS, .msi on Windows.
# Build flow per platform (see .github/workflows/release.yml):
#
#   cargo packager --release \
#     -p citrate-inference-gateway \
#     --formats deb appimage \
#     --out-dir dist
#
# `before-packaging-command` builds the binary so the packager picks it up.
# Icon assets in ../packaging/ — placeholder until official Citrate branding lands.
# ──────────────────────────────────────────────────────────────────────
[package.metadata.packager]
name             = "Citrate Inference Gateway"
product-name     = "Citrate Inference Gateway"
identifier       = "ai.citrate.inference-gateway"
description      = "OpenAI-compatible HTTP gateway over the Citrate compute marketplace"
long-description = """
The Citrate Inference Gateway exposes an OpenAI-compatible
/v1/chat/completions API backed by the Citrate compute marketplace.
Requests are routed through the InferenceRouter contract with x402
metering. Self-hosted by node operators on the Citrate testnet
(chain id 40204) or mainnet.
"""
homepage     = "https://citrate.ai"
authors      = ["Mozi Cooperative <partnerships@citrate.ai>"]
license-file = "../LICENSE"
category     = "DeveloperTool"
before-packaging-command = "cargo build --release --bin citrate-inference-gateway"
icons        = ["../packaging/icon.png", "../packaging/icon.ico"]

# .deb specifics
[package.metadata.packager.deb]
section  = "net"
priority = "optional"

# .dmg specifics
[package.metadata.packager.dmg]
window-size = { width = 600, height = 400 }

# .msi (WiX) defaults are fine for pilot. cargo-packager auto-generates
# the upgrade-code from the identifier; explicit configuration needed only
# when shipping signed installers (post-pilot).

[dependencies]
# Transport
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "sensitive-headers"] }
http = "1.1"

# Async + HTTP client (for outbound provider calls + chain RPC)
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Cryptography (for hashing requests, etc.)
sha3 = { workspace = true }
# RM-G2.3 / audit F-3: API keys are stored as sha256(key_id), so a
# memory dump or RocksDB snapshot leak doesn't surface live tokens.
sha2 = "0.10"
hex = "0.4"
ethereum-types = "0.14"

# Citrate integration — x402-axum stays internal to this workspace.
# citrate-wallet-core is consumed from CitrateNetwork/citrate-chain via SSH
# deploy key (federation-transition interim). When citrate-chain publishes
# to crates.io after its first audited release, swap to a semver dep:
#     citrate-wallet-core = "0.5"
x402-axum = { path = "../crates/x402-axum" }
citrate-wallet-core = { workspace = true }

# Observability — env-filter + json features needed by main.rs
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = { workspace = true }

# Local config helper
toml = "0.8"
async-trait = { workspace = true }
uuid = { version = "1", features = ["v4"] }
# Needed to collect the inner service's Response body so the API-key
# auth layer can post-process 402 challenges (adds deposit hint).
http-body-util = "0.1"
# Prometheus metrics — same versions the node uses
metrics = "0.21"
metrics-exporter-prometheus = "0.12"
once_cell = "1.19"

# Local-proxy mode (WP-1 + WP-2 + WP-3 of 2026-06-04-gateway-apikey-hardening):
# RocksDB-backed key store + admin CLI. Workspace pins these versions; we
# only restate the dep to make them available to this crate.
rocksdb = { workspace = true }
bincode = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
# (futures-util is already declared above for reqwest's bytes_stream())

# WP-C (INFER-S1): secp256k1 for the KMS signer's crypto helpers — DER
# signature decode + low-S normalize + SPKI→address. Light (already in the tree
# via x402-axum). The AWS SDK itself (aws-sdk-kms/aws-config) is intentionally
# NOT vendored here: it transitively pulls a vulnerable legacy rustls
# (RUSTSEC-2026-0098/0099/0104) that the audit gate denies. The KMS *adapter*
# (the network client) lands in the security-reviewed custody slice that already
# gates the funded-testnet deploy; this PR ships the signer framework + the
# KMS-agnostic crypto, audit-clean.
k256 = { version = "0.13", features = ["ecdsa"] }

# Second binary — the admin CLI ships in the same crate so it shares the
# keystore module with the gateway proper.
[[bin]]
name = "citrate-gateway-admin"
path = "src/bin/citrate-gateway-admin.rs"

[dev-dependencies]
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
