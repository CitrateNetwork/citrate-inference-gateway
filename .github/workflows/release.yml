name: Release (inference-gateway)

# Native-installer release for inference-gateway via cargo-packager.
# Per-platform matrix produces user-installable packages instead of raw
# tarballs:
#   * Linux (ubuntu-latest)   →  .deb + .AppImage
#   * macOS (macos-latest)    →  .dmg (Apple Silicon native; Intel via Rosetta)
#   * Windows (windows-latest) →  .msi (WiX)
# Packaging config lives in gateway/Cargo.toml under
# `[package.metadata.packager]`. Icons under packaging/.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish or rebuild'
        required: true
        type: string
      publish_release:
        description: 'Publish immediately instead of draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            formats: deb appimage
          - os: macos
            runner: macos-latest
            formats: dmg
          - os: windows
            runner: windows-latest
            formats: wix
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake libssl-dev pkg-config libfuse2

      # REM-22 — inference-gateway pulls citrate-wallet-core from
      # citrate-chain via the github-citrate-chain ssh alias. CI must
      # provision this alias before `cargo build` (which packager invokes
      # via before-packaging-command).
      - name: Configure SSH host alias (REM-22)
        env:
          CHAIN_DEPLOY_KEY: ${{ secrets.CHAIN_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$CHAIN_DEPLOY_KEY" ]; then
            echo "$CHAIN_DEPLOY_KEY" > ~/.ssh/chain_deploy
            chmod 600 ~/.ssh/chain_deploy
            cat >> ~/.ssh/config <<'EOF'
          Host github-citrate-chain
            HostName github.com
            User git
            IdentityFile ~/.ssh/chain_deploy
            StrictHostKeyChecking accept-new
          EOF
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          else
            echo "::error::CHAIN_DEPLOY_KEY secret not set — cargo will fail to fetch citrate-wallet-core. See REM-22."
            exit 1
          fi
        shell: bash

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
        shell: bash

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pkg-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}

      - name: cargo-packager → native installer(s)
        working-directory: gateway
        run: |
          cargo packager --release --formats ${{ matrix.formats }} --out-dir ../dist
        shell: bash

      - name: SHA256
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          for f in *.deb *.AppImage *.dmg *.msi *.exe; do
            if [[ -f "$f" ]]; then
              if [[ "${{ runner.os }}" == "macOS" ]]; then
                shasum -a 256 "$f" > "$f.sha256"
              else
                sha256sum "$f" > "$f.sha256"
              fi
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/*.msi
            dist/*.exe
            dist/*.sha256
          retention-days: 30

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # REM-22 — sbom job fetches deps via cargo; needs the chain ssh alias.
      - name: Configure SSH host alias (REM-22)
        env:
          CHAIN_DEPLOY_KEY: ${{ secrets.CHAIN_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$CHAIN_DEPLOY_KEY" ]; then
            echo "$CHAIN_DEPLOY_KEY" > ~/.ssh/chain_deploy
            chmod 600 ~/.ssh/chain_deploy
            cat >> ~/.ssh/config <<'EOF'
          Host github-citrate-chain
            HostName github.com
            User git
            IdentityFile ~/.ssh/chain_deploy
            StrictHostKeyChecking accept-new
          EOF
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          else
            echo "::error::CHAIN_DEPLOY_KEY secret not set."
            exit 1
          fi
        shell: bash
      - run: cargo install --locked cargo-cyclonedx
      - run: cargo cyclonedx --format json --override-filename citrate-inference-gateway-sbom
      - uses: actions/upload-artifact@v4
        with:
          name: citrate-inference-gateway-sbom
          path: 'citrate-inference-gateway-sbom*.json'
          retention-days: 90

  release:
    runs-on: ubuntu-latest
    needs: [package, sbom]
    permissions:
      contents: write
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.sha256' -o -name '*.json' \) -exec cp {} release-files/ \;
          ls -la release-files/
      - id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: citrate-inference-gateway ${{ steps.tag.outputs.tag }}
          draft: ${{ !github.event.inputs.publish_release }}
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: release-files/*
          body: |
            ## citrate-inference-gateway ${{ steps.tag.outputs.tag }}

            Native installers for the Citrate Inference Gateway — an
            OpenAI-compatible HTTP API over the Citrate compute marketplace.

            ### Install

            | Platform | File | Install |
            |---|---|---|
            | **Ubuntu / Debian / DGX** | `*.deb`       | `sudo dpkg -i citrate-inference-gateway_*.deb` |
            | **Linux (any)**           | `*.AppImage`  | `chmod +x *.AppImage && ./citrate-inference-gateway_*.AppImage` |
            | **macOS**                 | `*.dmg`       | Double-click → drag to Applications |
            | **Windows**               | `*.msi`       | Double-click → next-next-finish |

            ### Pilot disclaimer
            Unsigned. macOS Gatekeeper will warn: right-click → Open to
            run. Windows SmartScreen will warn: More Info → Run Anyway.
            Code-signing certs are a follow-on phase (see handoff §14).

            ### Verify
            `sha256sum -c *.sha256` (Linux), `shasum -a 256 -c *.sha256` (macOS).

            ### After install
            Configure: `~/.citrate/gateway.toml`. Start: `citrate-inference-gateway --help`.
            Connects to bootnodes `boot{1,2,3}.citrate.network` (testnet chain id 40204).
