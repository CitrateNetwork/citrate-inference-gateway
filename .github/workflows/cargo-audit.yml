name: cargo audit (tripwire)

# REM-16 tripwire (2026-05-20 federation-split audit):
# Runs cargo-audit per-PR + weekly. Per the SOP at
# citrate-agentile-archive/sops/vulnerability-scanning.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 0 8 * * 1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-audit-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        # The runner validates every exception's expiry/reason and mirrors it
        # against audit.toml before invoking cargo audit --deny warnings.
        run: python3 scripts/ci/run_cargo_audit.py
