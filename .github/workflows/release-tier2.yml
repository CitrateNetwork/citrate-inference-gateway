# Tier-2 packaging workflow for citrate-inference-gateway.
#
# Generated from citrate-labs/branding/templates/release-tier2.yml.template
# by apply-tier2.sh. Edit the template (in citrate-labs) rather than the
# per-repo copy; the per-repo file gets overwritten on next sync.
#
# Triggers on tag push `v*-tier2` so a release can ship a Tier-1
# (raw binary tarball) and a Tier-2 (signed installer) variant
# independently, e.g.:
#   git tag v0.5.0-beta2          # → Tier-1 only (release.yml)
#   git tag v0.5.0-beta2-tier2    # → Tier-2 installers (this workflow)
#
# Manual rebuild:
#   gh workflow run release-tier2.yml --ref main \
#     -f release_tag=v0.5.0-beta2-tier2

name: Release Tier-2 (citrate-inference-gateway)

on:
  push:
    tags:
      - 'v*-tier2'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to publish or rebuild (e.g. v0.5.0-beta2-tier2)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write       # cosign keyless OIDC signing for installer artifacts

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            packager-formats: deb,appimage
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            packager-formats: deb,appimage
          - target: x86_64-apple-darwin
            runner: macos-latest
            packager-formats: app,dmg
          - target: aarch64-apple-darwin
            runner: macos-latest
            packager-formats: app,dmg
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            packager-formats: wix,nsis
    env:
      # Exposed so the SSH-setup steps below can self-skip on repos that have
      # no cross-repo SSH git deps (e.g. citrate-chain). Repos that consume
      # private sibling crates via ssh:// host aliases (gui-native, defense_prime-shell)
      # set these deploy-key secrets and the steps activate.
      CHAIN_DEPLOY_KEY: ${{ secrets.CHAIN_DEPLOY_KEY }}
      LEARNING_CENTER_DEPLOY_KEY: ${{ secrets.LEARNING_CENTER_DEPLOY_KEY }}
      AGENT_RUNTIME_DEPLOY_KEY: ${{ secrets.AGENT_RUNTIME_DEPLOY_KEY }}
      # Force lzma-sys / xz2 to build liblzma from source and link it
      # statically. Otherwise the macOS runner's Homebrew xz gets dynamically
      # linked into the binary (load path `/opt/homebrew/opt/xz/lib/liblzma.5.dylib`)
      # and the hardened-runtime + Developer-ID-signed app refuses to load it
      # on user machines because it's signed by a different Team ID — crashing
      # at launch with "Library not loaded: …liblzma.5.dylib … different Team IDs".
      LZMA_API_STATIC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          submodules: recursive

      # Cross-repo private git deps (citrate-agent-runtime, citrate-chain,
      # citrate-learning-center) are pulled via ssh:// host aliases. Set up the
      # deploy keys + host aliases exactly like the regular CI so `cargo build`
      # can clone them. Skipped when the deploy-key secrets are absent (chain).
      - name: Setup SSH agent (cross-repo deploy keys)
        if: ${{ env.AGENT_RUNTIME_DEPLOY_KEY != '' }}
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.CHAIN_DEPLOY_KEY }}
            ${{ secrets.LEARNING_CENTER_DEPLOY_KEY }}
            ${{ secrets.AGENT_RUNTIME_DEPLOY_KEY }}

      - name: Configure SSH host aliases
        if: ${{ env.AGENT_RUNTIME_DEPLOY_KEY != '' }}
        shell: bash
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          umask 077
          echo "${{ secrets.CHAIN_DEPLOY_KEY }}"           > ~/.ssh/citrate-chain-readonly
          echo "${{ secrets.LEARNING_CENTER_DEPLOY_KEY }}" > ~/.ssh/citrate-learning-center-readonly
          echo "${{ secrets.AGENT_RUNTIME_DEPLOY_KEY }}"   > ~/.ssh/citrate-agent-runtime-readonly
          chmod 600 ~/.ssh/citrate-*-readonly
          cat > ~/.ssh/config <<'SSHEOF'
          Host github-citrate-chain
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-chain-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          Host github-citrate-learning-center
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-learning-center-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          Host github-citrate-agent-runtime
              HostName github.com
              User git
              IdentityFile ~/.ssh/citrate-agent-runtime-readonly
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
          SSHEOF
          chmod 600 ~/.ssh/config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Bundled AI model — fetched per build, not stored in git (5 GB+).
      # cargo-packager's `resources` list embeds it into the installer.
      # Cached across runs by the .gguf.sha256 + checked against it.
      - name: Cache bundled models
        id: cache-models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: branding/models/*.gguf
          key: gguf-${{ hashFiles('branding/models/*.gguf.sha256') }}

      - name: Fetch bundled models (sha256-verified)
        if: steps.cache-models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -e
          mkdir -p branding/models
          # Pick a portable sha256 verifier — Linux/macOS have shasum or
          # sha256sum, Windows runners have openssl via Git Bash. We try in
          # order so the same step works on all three matrix legs.
          verify() {
            local sha_file="$1"
            local dir; dir=$(dirname "$sha_file")
            local base; base=$(basename "$sha_file")
            ( cd "$dir" && {
              if command -v shasum     >/dev/null 2>&1 ; then shasum -a 256 -c "$base"
              elif command -v sha256sum >/dev/null 2>&1 ; then sha256sum -c "$base"
              else
                # openssl path — compute and compare manually
                expected=$(awk '{print $1}' "$base")
                actual=$(openssl dgst -sha256 "${base%.sha256}" | awk '{print $NF}')
                [ "$expected" = "$actual" ] || { echo "sha256 mismatch: expected $expected got $actual"; exit 1; }
              fi
            } )
          }
          for sha_file in branding/models/*.gguf.sha256 ; do
            [ -f "$sha_file" ] || continue
            name=$(basename "${sha_file%.sha256}")
            # Primary: ggml-org canonical; fallback: bartowski mirror.
            primary="https://huggingface.co/ggml-org/gemma-4-E4B-it-GGUF/resolve/main/$name"
            fallback="https://huggingface.co/bartowski/google_gemma-4-E4B-it-GGUF/resolve/main/google_$name"
            echo "fetching $name…"
            curl -fL --retry 3 --retry-delay 5 -o "branding/models/$name" "$primary" \
              || curl -fL --retry 3 --retry-delay 5 -o "branding/models/$name" "$fallback"
            verify "$sha_file"
            echo "  ✓ $name verified"
          done

      - name: Linux build deps (.deb/.rpm/.AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev cmake pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libfuse2 rpm
          # libfuse2 is required at AppImage build-time. rpm provides
          # /usr/bin/rpmbuild which cargo-packager invokes for the .rpm
          # format. GTK/WebKit pulled in only for repos that need a
          # webview shell; safe overinclusion for daemon-only repos.

      - name: Windows build deps (Strawberry Perl + NASM for vendored OpenSSL)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "C:\\Strawberry\\perl\\bin"  >> $GITHUB_PATH
          echo "C:\\Strawberry\\c\\bin"     >> $GITHUB_PATH
          echo "OPENSSL_SRC_PERL=C:\\Strawberry\\perl\\bin\\perl.exe" >> $GITHUB_ENV
          choco install nasm -y --no-progress || true
          echo "C:\\Program Files\\NASM" >> $GITHUB_PATH

      - name: Import Apple Developer ID cert (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/citrate.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -k $KEYCHAIN \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security list-keychain -d user -s $KEYCHAIN

      - name: Import Windows Authenticode cert (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pwd = ConvertTo-SecureString -String "$env:WINDOWS_CERTIFICATE_PASSWORD" -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tier2-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-packager
        run: cargo install --locked cargo-packager

      - name: Build release binaries
        shell: bash
        run: |
          set -e
          cargo build --release --locked --target ${{ matrix.target }} \
            -p citrate-inference-gateway

      - name: Package installers
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        # cargo-packager 0.11.8 does not auto-detect a standalone
        # packager.toml at the workspace root (only [package.metadata.packager]
        # inside a Cargo.toml). Converting our packager.toml to inline JSON
        # and passing via --config bypasses the auto-detect logic. python3
        # is preinstalled on every GitHub-hosted runner (Linux, macOS,
        # Windows) so this stays portable.
        run: |
          set -e
          # Absolute repo-root target dir — cargo builds the workspace here
          # regardless of how deep gateway is, so this is correct
          # for chain (node/), gui (gui/citrate_desktop_app/), and pool (.).
          TARGET_DIR="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release"
          cd gateway
          CONFIG_JSON=$(CITRATE_TARGET_DIR="$TARGET_DIR" python3 -c "
          import json, os
          try: import tomllib
          except ImportError: import tomli as tomllib
          with open('packager.toml','rb') as f: d = tomllib.load(f)
          # The --binaries-dir CLI flag is ignored when --config is a raw JSON
          # string, so packager defaults to out-dir and the binary copy fails
          # with 'No such file or directory'. Inject an absolute binaries-dir.
          d['binaries-dir'] = os.environ['CITRATE_TARGET_DIR']
          # macOS signing-identity. cargo-packager only signs when the config
          # has a non-empty signing-identity, so:
          #   - signed build  (APPLE_SIGNING_IDENTITY env set): inject the real
          #     identity into the config; without it, codesign runs with "" and
          #     fails OR (worse) packager silently emits an unsigned .app.
          #   - unsigned build (env unset, packager.toml has identity = ""):
          #     drop the empty value entirely so packager skips signing cleanly.
          m = d.setdefault('macos', {})
          if os.environ.get('APPLE_SIGNING_IDENTITY'):
              m['signing-identity'] = os.environ['APPLE_SIGNING_IDENTITY']
          elif not m.get('signing-identity'):
              m.pop('signing-identity', None)
          # Entitlements path. cargo-packager invokes codesign with the cwd set
          # to its package out-dir on some platforms — a relative entitlements
          # path then resolves to .../target/<triple>/release/packages/branding/...
          # which doesn't exist, and codesign aborts with 'cannot read
          # entitlement data'. Resolve to an absolute path here so it works
          # regardless of where codesign cd's to.
          ent = m.get('entitlements')
          if ent and not os.path.isabs(ent):
              m['entitlements'] = os.path.abspath(ent)
          print(json.dumps(d))
          ")
          cargo packager --release --target ${{ matrix.target }} \
            --formats ${{ matrix.packager-formats }} \
            --config "$CONFIG_JSON" \
            --out-dir "$TARGET_DIR/packages"

      - name: Notarize macOS artefacts
        if: runner.os == 'macOS' && env.APPLE_NOTARY_USER != ''
        env:
          APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for f in target/${{ matrix.target }}/release/packages/*.dmg \
                   target/${{ matrix.target }}/release/packages/*.app.zip ; do
            [[ -f "$f" ]] || continue
            echo "Notarising $f..."
            xcrun notarytool submit "$f" \
              --apple-id "$APPLE_NOTARY_USER" \
              --password "$APPLE_NOTARY_PASSWORD" \
              --team-id  "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$f" || true
          done

      - name: SHA-256 sums
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release/packages
          for f in * ; do
            [[ -f "$f" ]] || continue
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              shasum -a 256 "$f" > "$f.sha256"
            else
              sha256sum "$f" > "$f.sha256"
            fi
          done
          ls -la

      - name: Upload artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tier2-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/packages/*
          retention-days: 30

  publish:
    name: Publish Tier-2 release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine tag
        id: tag
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG_INPUT" ]]; then
            if [[ ! "$RELEASE_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::release_tag must be a SemVer-style vX.Y.Z tag"
              exit 1
            fi
            printf 'tag=%s\n' "$RELEASE_TAG_INPUT" >> "$GITHUB_OUTPUT"
          else
            printf 'tag=%s\n' "${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate SHA256SUMS
        run: |
          cd dist
          cat *.sha256 2>/dev/null | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign installers (keyless OIDC)
        run: |
          cd dist
          shopt -s nullglob
          for f in *.dmg *.msi *.exe *.deb *.rpm *.AppImage *.app.zip ; do
            [[ -f "$f" ]] || continue
            COSIGN_EXPERIMENTAL=1 cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" || true
          done

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-rc.') || contains(steps.tag.outputs.tag, '-beta') || contains(steps.tag.outputs.tag, '-alpha') }}
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
