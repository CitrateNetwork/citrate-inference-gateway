# cargo-audit exception list.
#
# The executable expiry/reason policy is in
# scripts/ci/cargo-audit-policy.toml. `scripts/ci/run_cargo_audit.py` checks
# that this assessor-visible list and the executable policy remain identical,
# then passes the list to cargo-audit explicitly because cargo-audit does not
# automatically load project-local audit.toml.

[advisories]
ignore = [
    "RUSTSEC-2024-0388",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0055",
    "RUSTSEC-2025-0124",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2026-0190",
    "RUSTSEC-2026-0253",
]
